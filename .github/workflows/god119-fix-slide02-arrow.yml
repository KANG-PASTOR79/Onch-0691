name: Fix GOD119 slide 2 double arrow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/god119-fix-slide02-arrow.yml'
      - 'GOD119/scripts/clean_slide02.py'
      - 'GOD119/slides/slide-02.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: god119-fix-slide02-arrow
  cancel-in-progress: false

jobs:
  remove-baked-in-chevron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image library
        run: python -m pip install pillow
      - name: Remove only the old static arrow
        run: python GOD119/scripts/clean_slide02.py
      - name: Commit the corrected slide 02 image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GOD119/slides/slide-02.webp GOD119/slides/slide-02-arrow-clean.json
          if git diff --cached --quiet; then
            echo 'Already up to date.'
          else
            git commit -m 'Remove original fixed chevron from slide 02'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
