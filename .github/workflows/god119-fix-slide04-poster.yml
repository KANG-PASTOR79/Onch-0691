name: Fix GOD119 slide 4 portrait proportions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/god119-fix-slide04-poster.yml'
      - 'GOD119/scripts/fix_slide04_poster.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: god119-fix-slide04-poster
  cancel-in-progress: false

jobs:
  restore-portrait-proportions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Fix poster proportions on slide 04 only
        run: python GOD119/scripts/fix_slide04_poster.py
      - name: Commit corrected slide image and version marker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GOD119/slides/slide-04.webp GOD119/slides/slide-04-upright.json
          if git diff --cached --quiet; then
            echo 'Slide 04 is already corrected.'
          else
            git commit -m 'Restore natural portrait ratio to slide 04 poster'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
